# SHARKCODE node format v1. Поля META описывают узел, GAME — контракт.
[META]
id = "stesnyaga"
location = "variable_valley"
type = "enemy.code"
name = "Стесняга"
tt = "Выведи: Hello world!"
lore = "Он милый парень, но социопат. Поздоровайся с ним."

[GAME]
input = ""
