tt = """Создай две функции: регистрацию и вход. Не вызывай их сам — старший айтишник вызовет их несколько раз в одном процессе.

Регистрация получает через input() одну строку формата «Имя Фамилия XX лет/года Почта», где возраст состоит из двух цифр. Сохрани в словаре аккаунт с именем, фамилией, возрастом, почтой ДО символа @ и паролем. Выведи «Привет, Имя! Добро пожаловать», затем «Тебе XX год/года/лет, придумай пароль!» с правильным окончанием. Вводи пароли до подходящего: минимум восемь символов, хотя бы одна цифра и хотя бы один знак из &#₽%@*<>. Запиши принятый пароль в аккаунт.

Вход получает строку «Почта Пароль», где почта полная. Найди аккаунт по части до @ и паролю и выведи «Здравствуйте, Имя». Если аккаунт не найден или пароль неверен, выведи «Пусто ;(» и «Зарегистрироваться?». Прочитай «да» или «нет»; при «да» вызови функцию регистрации, при «нет» ничего не делай.

Вспомогательные функции разрешены. Поддержка трёхзначного возраста поощряется, но не обязательна."""

